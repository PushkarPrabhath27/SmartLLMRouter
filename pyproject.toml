[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartroute"
version = "0.1.0"
description = "Local-first, embeddable LLM prompt router with per-project adaptive learning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pushkar Prabhath and SmartRoute contributors" }]
keywords = ["llm", "routing", "prompts", "openai", "anthropic", "groq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.19",
    "tiktoken>=0.5",
    "pydantic>=2.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/PushkarPrabhath27/SmartLLMRouter"
Repository = "https://github.com/PushkarPrabhath27/SmartLLMRouter"

[tool.hatch.build.targets.wheel]
packages = ["smartroute"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["smartroute", "tests"]
# specs/ is frozen ground-truth documentation; its embedded code snippets are
# illustrative and must not be reformatted.
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["smartroute"]

[tool.mypy]
strict = true
files = ["smartroute"]
python_version = "3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["smartroute"]
