routing:
  low_complexity: "groq"
  medium_complexity: "openai"
  high_complexity: "anthropic"

  overrides:
    - match: "\\b(pandas|numpy|scipy|sklearn|matplotlib|seaborn|plotly)\\b"
      match_type: "regex"
      model: "openai"
      description: "Data science libraries -> structured output needs GPT"

    - match: "dataframe"
      match_type: "contains"
      model: "openai"
      description: "Dataframe work needs GPT"

adaptation:
  enabled: true
  bump_threshold: 0.3
  cooldown_minutes: 5
  ema_alpha: 0.3
  min_calls_before_bump: 10
